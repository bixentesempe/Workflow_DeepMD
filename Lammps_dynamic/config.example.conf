# config.example.conf
# ============================================================================
# Exemple de fichier de config pour massif_lammps.sh (--config/-c).
#
# Copie ce fichier, adapte-le, puis lance :
#   massif_lammps.sh --config mon_run.conf
#
# N'importe quelle option peut aussi etre surchargee ponctuellement sur la
# ligne de commande, EN PLUS du fichier -- un flag CLI remplace toujours la
# valeur du fichier :
#   massif_lammps.sh --config mon_run.conf -e 0.5
#
# Toutes les cles sont optionnelles : ce qui n'est pas defini ici garde la
# valeur par defaut de massif_lammps.sh (voir --help).
# ============================================================================

# --- Mode H2 (interne) -------------------------------------------------
mode=zpe                    # "zpe" (Morse, defaut) ou "nozpe"
vib_level=0                 # (zpe) niveau vibrationnel v
jrot=0                      # (zpe) nombre quantique rotationnel J
# hh_distance=0.7414        # (nozpe) distance H-H (A)
# orientation=random        # (nozpe) random|x|y|z|"vx,vy,vz"

# --- Surface -------------------------------------------------------------
# surface_mode choisit EXPLICITEMENT laquelle des deux options en-dessous
# compte -- l'autre est ignoree (avec un avertissement si elle est quand
# meme definie), jamais devine d'apres ce qui est rempli.
surface_mode=thermal        # "cold" (LAMMPS_POSCAR figee, 0K) ou
                             # "thermal" (pool AIMD, T/coverage donnes)

# cold : un LAMMPS_POSCAR unique, figee a vitesse nulle (0K)
# path2poscar=/chemin/vers/LAMMPS_POSCAR

# thermal : pool de POSCAR-* issus d'un AIMD a une temperature et un
# coverage donnes (ex. produits par extract_md_configs.py), un tirage
# aleatoire par trajectoire :
thermal_surface_dir=/chemin/vers/extracted_configs/0.25ML300K/POSCAR

# frozen_ids="35-42"        # IDs supplementaires a figer (en plus des
                             # "# fixed" du LAMMPS_POSCAR / des Selective
                             # dynamics F F F du pool thermalise)

# --- Modeles DeepMD --------------------------------------------------------
path2models=/chemin/vers/models     # dossier contenant <modele>/graph.pb
folders=(model_A model_B)           # noms des modeles (remplace les
                                     # arguments positionnels de la CLI)

# --- Energies / angles d'incidence -----------------------------------------
energies=(0.1 0.2 0.3)      # eV, remplace les -e repetes de la CLI
theta=0                     # deg, angle / normale
phi=random                  # deg, ou "random"
height=9.0                  # A, hauteur initiale du CdM de H2 au-dessus
                             # du W le plus haut

# --- Volume de calcul --------------------------------------------------
ntraj=20000                 # nombre de trajectoires par (modele, energie)
traj_per_job=10              # trajectoires par tache SLURM (1 CPU)
nstep=5000                  # pas de temps LAMMPS par trajectoire
tstep=0.0001                # pas de temps LAMMPS (ps)

# --- Divers ----------------------------------------------------------------
# seed=42                   # seed du RNG (vide = aleatoire)
# results_name=run_300K     # nom du dossier de resultats
# case_dir=/chemin/vers/case  # dossier du cas (LAMMPS_POSCAR, in.simulation)
